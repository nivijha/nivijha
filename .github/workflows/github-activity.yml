name: Update GitHub Activity Graph

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: nivijha

          options: >-
            bg_color=0d1117
            &color=c9d1d9
            &title_color=58a6ff
            &line=6366f1
            &point=818cf8
            &area_color=312e81
            &area=true
            &hide_border=true
            &radius=12
            &height=350
            &days=31
            &grid=true

          output_path: dist/activity-graph.svg

          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Activity Graph
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}