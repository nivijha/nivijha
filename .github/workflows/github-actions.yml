name: Update GitHub Activity Chart

on:
  schedule:
    # Run every 6 hours
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate activity chart
        uses: dturovskiy/deus-commit-chart@v1
        with:
          username: nivijha
          token: ${{ github.token }}
          default-days: "365"
          ranges: "365"
          layout: spacious
          output-dir: activity-dist

      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add activity-dist/

          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "chore: update GitHub activity"
            git push
          fi